services:
  # ---------------------------------------------------------------------------
  # SchemeSetu Backend Web Service (Spring Boot 3 + Java 21)
  # ---------------------------------------------------------------------------
  - type: web
    name: schemesetu-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/v1/schemes
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATA_REDIS_HOST
        fromService:
          type: pserv
          name: schemesetu-redis
          property: host
      - key: SPRING_DATA_REDIS_PORT
        fromService:
          type: pserv
          name: schemesetu-redis
          property: port

  # ---------------------------------------------------------------------------
  # SchemeSetu Redis Private Service
  # ---------------------------------------------------------------------------
  - type: pserv
    name: schemesetu-redis
    runtime: image
    image:
      url: redis:7-alpine
    plan: starter
