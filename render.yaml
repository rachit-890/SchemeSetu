services:
  # ---------------------------------------------------------------------------
  # SchemeSetu Backend Web Service (Spring Boot 3 + Java 21)
  # ---------------------------------------------------------------------------
  - type: web
    name: schemesetu-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/v1/schemes
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: schemesetu-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: schemesetu-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: schemesetu-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: schemesetu-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: schemesetu-db
          property: password
      - key: SPRING_DATA_REDIS_HOST
        fromService:
          type: pserv
          name: schemesetu-redis
          property: host
      - key: SPRING_DATA_REDIS_PORT
        fromService:
          type: pserv
          name: schemesetu-redis
          property: port

  # ---------------------------------------------------------------------------
  # SchemeSetu Redis Private Service
  # ---------------------------------------------------------------------------
  - type: pserv
    name: schemesetu-redis
    runtime: image
    image:
      url: redis:7-alpine
    plan: starter

# -----------------------------------------------------------------------------
# SchemeSetu Managed PostgreSQL Database (with pgvector support)
# -----------------------------------------------------------------------------
databases:
  - name: schemesetu-db
    databaseName: schemesetu
    user: schemesetu_user
    plan: starter
    postgresMajorVersion: "16"
