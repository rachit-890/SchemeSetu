spring:
  application:
    name: schemesetu-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/schemesetu
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dummy-openai-key}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:dummy-anthropic-key}

server:
  port: 8080
