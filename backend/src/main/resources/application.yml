spring:
  application:
    name: schemesetu-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/schemesetu
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  ai:
    retry:
      max-attempts: 2
      back-off:
        initial-interval: 1000ms
        max-interval: 2000ms
        multiplier: 2.0
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:dummy-anthropic-key}
      base-url: https://capi.aerolink.lat
      chat:
        options:
          model: claude-sonnet-4-6
    openai:
      api-key: ${OPENAI_API_KEY:dummy-openai-key}
      base-url: https://cgapi.aerolink.lat
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

server:
  port: 8080